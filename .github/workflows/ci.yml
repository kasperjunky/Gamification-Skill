name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No package.json in the repo (directory policy forbids lockfile installs for
      # non-verified orgs), so run the tooling via npx instead of `npm install`.
      - name: Tests
        run: npx --yes tsx@4.16.0 skills/gamification-engine/test.ts
