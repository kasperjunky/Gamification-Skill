name: Bug report
description: Something in the engine behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please include enough to reproduce the behavior deterministically.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
      placeholder: "Emitting `item.created` twice granted the `first_item` bonus twice."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The relevant config and the sequence of events. A minimal snippet using `MemoryAdapter` is ideal.
      render: ts
      placeholder: |
        const engine = new GamificationEngine(config, new MemoryAdapter());
        await engine.emit('u1', { type: 'item.created', subjectId: 'a', eventId: 'e1' });
        await engine.emit('u1', { type: 'item.created', subjectId: 'a', eventId: 'e1' });
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Storage adapter
      options:
        - MemoryAdapter
        - OptimisticAdapter (or a custom optimistic backend)
        - FirestoreAdapter
        - Other / custom
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.x"
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Any error output. This is automatically formatted as code.
      render: shell
